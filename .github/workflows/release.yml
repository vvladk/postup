name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            os_name: windows
            binary: postup.exe
          - goos: darwin
            goarch: amd64
            os_name: macos
            binary: postup
          - goos: darwin
            goarch: arm64
            os_name: macos
            binary: postup
          - goos: linux
            goarch: amd64
            os_name: linux
            binary: postup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary }} .
          mkdir postup
          mv ${{ matrix.binary }} postup/
          zip -r postup-${{ matrix.os_name }}-${{ matrix.goarch }}.zip postup/

      - uses: actions/upload-artifact@v4
        with:
          name: postup-${{ matrix.os_name }}-${{ matrix.goarch }}
          path: postup-${{ matrix.os_name }}-${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
