{{define "content"}}
<div class="login-page">
    {{if .Invalid}}
    <h1>Запрошення недійсне</h1>
    <p class="text-muted">Запрошення недійсне або вже використане.</p>
    {{else}}
    <h1>Вітаємо! Встанови пароль для входу</h1>
    {{template "form_error" .Error}}
    <form method="POST" action="/invite/{{.Token}}">
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required autofocus minlength="4">
        </div>
        <div class="form-group">
            <label for="password_confirm">Підтвердження пароля</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary">Активувати акаунт</button>
    </form>
    {{end}}
</div>
{{end}}
