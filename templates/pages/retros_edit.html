{{define "content"}}
<div class="page-header">
    <h1>Редагування ретро</h1>
</div>

<p class="text-muted">{{.TeamName}}</p>

{{template "form_error" .Error}}

<form method="POST" action="/retros/{{.RetroID}}" class="retro-form">
    <div class="form-group">
        <label for="date">Дата і час</label>
        <input type="datetime-local" name="date" id="date"
               value="{{.Date}}" required>
    </div>

    <div class="form-group">
        <label for="vote_limit">Ліміт голосів на учасника</label>
        <input type="number" name="vote_limit" id="vote_limit"
               value="{{.VoteLimit}}" min="1" max="50">
    </div>

    <button type="submit" class="btn btn-primary">Зберегти</button>
</form>

<hr class="divider">

<form method="POST" action="/retros/{{.RetroID}}/finish"
      onsubmit="return confirm('Завершити ретро? Це незворотня дія.')">
    <button type="submit" class="btn btn-secondary">Завершити ретро</button>
</form>
{{end}}
