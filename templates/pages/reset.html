{{define "content"}}
<div class="login-page">
    {{if .Invalid}}
    <h1>Посилання недійсне</h1>
    <p class="text-muted">Посилання недійсне або прострочене.</p>
    <p><a href="/forgot-password">Запросити нове посилання</a></p>
    {{else}}
    <h1>Новий пароль</h1>
    {{template "form_error" .Error}}
    <form method="POST" action="/reset-password/{{.Token}}">
        <div class="form-group">
            <label for="password">Новий пароль</label>
            <input type="password" id="password" name="password" required autofocus minlength="8">
        </div>
        <div class="form-group">
            <label for="password_confirm">Підтвердження пароля</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">Змінити пароль</button>
    </form>
    {{end}}
</div>
{{end}}
