{{define "content"}}
<div class="invite-success">
    <h1>Ретроспектива створена!</h1>
    <p class="text-muted">{{.TeamName}} · {{.Date.Format "02.01.2006 о 15:04"}}</p>

    <div style="margin: 1.5rem 0">
        <p style="margin: 0 0 0.5rem">Поділись посиланням з командою:</p>
        <div class="invite-link-row">
            <input type="text" id="retro-invite-link" class="invite-link-input"
                   value="{{.InviteLink}}" readonly>
            <button class="btn btn-secondary"
                    data-link="{{.InviteLink}}"
                    onclick="copyToClipboard(this.dataset.link, this)">
                Копіювати посилання
            </button>
        </div>
    </div>

    <div style="display: flex; gap: 0.75rem">
        <a href="/retros/{{.RetroID}}/board" class="btn btn-primary">Перейти до ретро</a>
        <a href="/" class="btn btn-secondary">На головну</a>
    </div>
</div>
{{end}}
